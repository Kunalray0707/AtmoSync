version: '3.8'

services:
  # 1. Zookeeper Metadata Broker
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: atmosync-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # 2. Apache Kafka Streaming Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: atmosync-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # 3. PostgreSQL Operational Database
  postgres:
    image: postgres:15-alpine
    container_name: atmosync-postgres
    environment:
      POSTGRES_USER: atmosync
      POSTGRES_PASSWORD: atmosync_pass
      POSTGRES_DB: atmosync_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/01_postgres_schema.sql:/docker-entrypoint-initdb.d/init.sql

  # 4. Redis Cache & Broker
  redis:
    image: redis:7-alpine
    container_name: atmosync-redis
    ports:
      - "6379:6379"

  # 5. FastAPI Analytics REST Engine
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: atmosync-backend
    ports:
      - "8000:8000"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - redis

  # 6. React Executive Dashboard UI
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: atmosync-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  # 7. IoT Telemetry Simulator
  simulator:
    build:
      context: .
      dockerfile: docker/Dockerfile.simulator
    container_name: atmosync-simulator
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - kafka

volumes:
  postgres_data:
